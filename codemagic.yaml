workflows:
  ios-studylens:
    name: Build VisionClaw Study IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          set -e

          TARGET_SECRETS="./samples/CameraAccess/CameraAccess/Secrets.swift"
          mkdir -p "$(dirname "$TARGET_SECRETS")"

          FOUND_SECRETS=$(find . -maxdepth 5 -iname "Secrets.swift" | head -n 1)
          if [ -n "$FOUND_SECRETS" ] && [ "$FOUND_SECRETS" != "$TARGET_SECRETS" ]; then
            cp "$FOUND_SECRETS" "$TARGET_SECRETS"
          elif [ ! -f "$TARGET_SECRETS" ]; then
            python3 -c 'open("./samples/CameraAccess/CameraAccess/Secrets.swift", "w").write("import Foundation\n\nenum Secrets {\n    static let geminiAPIKey: String = \"\"\n    static let openClawHost: String = \"\"\n    static let openClawPort: Int = 0\n    static let openClawHookToken: String = \"\"\n    static let openClawGatewayToken: String = \"\"\n    static let cloudGatewayURL: String = \"\"\n    static let cloudGatewayToken: String = \"\"\n}\n")'
          fi

          WORKSPACE=$(find . -maxdepth 4 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 4 -name "*.xcodeproj" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['workspace']['schemes'][0])")
            xcodebuild -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath build/App.xcarchive \
              archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
            xcodebuild -project "$PROJECT" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath build/App.xcarchive \
              archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
          else
            echo "Не найден .xcworkspace или .xcodeproj"
            exit 1
          fi

          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r VisionClaw.ipa Payload
artifacts:
  - VisionClaw.ipa
