workflows:
  ios-studylens:
    name: Build VisionClaw Study IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          set -e
          TARGET_SECRETS="./samples/CameraAccess/CameraAccess/Secrets.swift"
          mkdir -p "$(dirname "$TARGET_SECRETS")"
          FOUND_SECRETS=$(find . -maxdepth 5 -iname "Secrets.swift" | head -n 1)
          if [ -n "$FOUND_SECRETS" ] && [ "$FOUND_SECRETS" != "$TARGET_SECRETS" ]; then
            cp "$FOUND_SECRETS" "$TARGET_SECRETS"
          elif [ ! -f "$TARGET_SECRETS" ]; then
            printf 'import Foundation\n\nenum Secrets {\n    static let geminiAPIKey: String = ""\n    static let openClawHost: String = ""\n    static let openClawPort: Int = 0\n    static let openClawHookToken: String = ""\n    static let openClawGatewayToken: String = ""\n    static let cloudGatewayURL: String = ""\n    static let cloudGatewayToken: String = ""\n}\n' > "$TARGET_SECRETS"
          fi

          cat << 'EOF' > /tmp/patch_project.py
          import glob, re, os, uuid

          for path in glob.glob("./samples/CameraAccess/**/*.swift", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content = re.sub(
                  r"(?<!await\s)LocalVideoTrack\.(createBufferTrack|createCameraTrack)\(",
                  r"await LocalVideoTrack.\1(",
                  content
              )
              if path.endswith("CameraAccessApp.swift"):
                  new_content = re.sub(
                      r"@State private var needsAccessCode =[\s\S]*?(?=\n\s*var body: some View)",
                      "@State private var needsAccessCode = false\n",
                      new_content
                  )
              if new_content != content:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print("Patched:", path)

          solver_path = "./samples/CameraAccess/CameraAccess/Gemini/GeminiStudySolver.swift"
          pbxproj_path = "./samples/CameraAccess/CameraAccess.xcodeproj/project.pbxproj"
          if os.path.exists(solver_path) and os.path.exists(pbxproj_path):
              with open(pbxproj_path, "r", encoding="utf-8") as f:
                  proj = f.read()
              if "GeminiStudySolver.swift" not in proj:
                  f_id = uuid.uuid4().hex[:24].upper()
                  b_id = uuid.uuid4().hex[:24].upper()
                  proj = proj.replace(
                      "/* Begin PBXBuildFile section */\n",
                      f"/* Begin PBXBuildFile section */\n\t\t{b_id} /* GeminiStudySolver.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {f_id} /* GeminiStudySolver.swift */; }};\n",
                      1
                  )
                  proj = proj.replace(
                      "/* Begin PBXFileReference section */\n",
                      f"/* Begin PBXFileReference section */\n\t\t{f_id} /* GeminiStudySolver.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; name = GeminiStudySolver.swift; path = CameraAccess/Gemini/GeminiStudySolver.swift; sourceTree = SOURCE_ROOT; }};\n",
                      1
                  )
                  proj = re.sub(
                      r"(/\* PBXSourcesBuildPhase \*/ = \{[\s\S]*?files = \(\n)",
                      rf"\1\t\t\t\t{b_id} /* GeminiStudySolver.swift in Sources */,\n",
                      proj,
                      count=1
                  )
                  with open(pbxproj_path, "w", encoding="utf-8") as f:
                      f.write(proj)
                  print("Added GeminiStudySolver.swift to project.pbxproj")
          EOF

          python3 /tmp/patch_project.py

          WORKSPACE=$(find . -maxdepth 4 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find . -maxdepth 4 -name "*.xcodeproj" | head -n 1)
          if [ -n "$WORKSPACE" ]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import sys, json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
            xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c "import sys, json; print(json.load(sys.stdin)['project']['schemes'][0])")
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_IDENTITY="" CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
          else
            echo "Не найден .xcworkspace или .xcodeproj"
            exit 1
          fi

          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r VisionClaw.ipa Payload
    artifacts:
      - VisionClaw.ipa
